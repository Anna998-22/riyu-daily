<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="开始点单">
  <!-- ================= 墙 + 两侧柔和光弧 ================= -->
  <rect x="0" y="0" width="640" height="480" fill="#F6E8D9"/>
  <rect x="66" y="70" width="240" height="280" rx="120" fill="#EEDDCA" opacity="0.85"/>
  <rect x="352" y="70" width="230" height="300" rx="115" fill="#F2E2D3" opacity="0.9"/>

  <!-- ================= 左：店員（正面略朝右，plum 围裙） ================= -->
  <g>
    <!-- 发块 -->
    <ellipse cx="210" cy="222" rx="30" ry="32" fill="#5A434A"/>
    <path d="M184 206 q30 -34 52 -6 q-6 16 -26 16 q-10 -6 -26 -10 z" fill="#7A5A5F" opacity="0.55"/>
    <!-- 脸 -->
    <ellipse cx="212" cy="233" rx="18.5" ry="18" fill="#F6CBAF"/>
    <!-- 刘海 -->
    <path d="M196 224 q6 -10 16 -8 q10 -4 18 4 q2 10 -8 12 q-12 2 -26 -8 z" fill="#5A434A"/>
    <!-- 侧发 -->
    <path d="M192 214 q-8 20 -6 34 q4 2 8 0 q2 -16 4 -30 z" fill="#5A434A"/>
    <path d="M232 214 q8 20 6 34 q-4 2 -8 0 q-2 -16 -4 -30 z" fill="#5A434A"/>
    <!-- 眉 眼 笑 颊 -->
    <line x1="201" y1="232" x2="208" y2="230" stroke="#8A5A52" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="218" y1="230" x2="225" y2="232" stroke="#8A5A52" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="206" cy="238" rx="3.4" ry="4.4" fill="#4A3438"/>
    <ellipse cx="222" cy="238" rx="3.4" ry="4.4" fill="#4A3438"/>
    <circle cx="207" cy="236.6" r="1" fill="#fff"/>
    <circle cx="223" cy="236.6" r="1" fill="#fff"/>
    <path d="M210 246 Q214 249 218 246" fill="none" stroke="#B0654A" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="200" cy="244" rx="5" ry="2.8" fill="#EEA3A0" opacity="0.6"/>
    <ellipse cx="226" cy="244" rx="5" ry="2.8" fill="#EEA3A0" opacity="0.6"/>
    <!-- 颈 -->
    <rect x="203" y="251" width="14" height="26" rx="7" fill="#F6CBAF"/>
    <!-- 上衣（浅） -->
    <path d="M148 276 Q210 256 272 276 L286 476 Q210 490 134 476 Z" fill="#F1E6DA"/>
    <!-- plum 围裙 -->
    <path d="M180 282 Q210 272 240 282 L252 478 Q210 490 168 478 Z" fill="#3D6BA8"/>
    <path d="M180 282 Q210 272 240 282 L236 306 Q210 300 184 306 Z" fill="#3898A0"/>
    <!-- 领口小蝴蝶结 -->
    <path d="M200 258 l-9 -5 v11 z" fill="#3898A0"/>
    <path d="M200 258 l9 -5 v11 z" fill="#3898A0"/>
    <circle cx="200" cy="258" r="2.4" fill="#266C74"/>
    <!-- 双臂（身前交叠，双手可见） -->
    <path d="M162 334 C182 330 192 322 202 320" fill="none" stroke="#F1E6DA" stroke-width="16" stroke-linecap="round"/>
    <path d="M258 334 C238 330 228 322 218 320" fill="none" stroke="#F1E6DA" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="203" cy="326" rx="8" ry="11" fill="#F6CBAF" transform="rotate(-10 203 326)"/>
    <ellipse cx="217" cy="326" rx="8" ry="11" fill="#F6CBAF" transform="rotate(10 217 326)"/>
    <!-- 侧发搭肩 -->
    <rect x="150" y="262" width="20" height="56" rx="10" fill="#5A434A"/>
    <rect x="250" y="262" width="20" height="56" rx="10" fill="#5A434A"/>
  </g>

  <!-- ================= 右：你（背影·粉外套·及肩发低马尾·双手自然垂身侧） ================= -->
  <g transform="translate(457 0)">
    <!-- 外套（先画，肩背在发下） -->
    <rect x="-45" y="292" width="90" height="156" rx="34" fill="#3898A0"/>
    <!-- 肩线（背中→肩点，勾出肩膀） -->
    <path d="M-20 304 Q-36 306 -43 324" stroke="#266C74" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M20 304 Q36 306 43 324" stroke="#266C74" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- 两臂垂在身侧（微外扩，袖色同外套） -->
    <path d="M-45 322 C-52 350 -53 372 -52 388" fill="none" stroke="#3898A0" stroke-width="15" stroke-linecap="round"/>
    <path d="M45 322 C52 350 53 372 52 388" fill="none" stroke="#3898A0" stroke-width="15" stroke-linecap="round"/>
    <!-- 双手（皮肤色小拳） -->
    <ellipse cx="-54" cy="395" rx="6.5" ry="9" fill="#F6CBAF"/>
    <ellipse cx="54" cy="395" rx="6.5" ry="9" fill="#F6CBAF"/>
    <!-- 及肩发（盖在外套上缘） -->
    <ellipse cx="0" cy="250" rx="41" ry="45" fill="#5A434A"/>
    <path d="M-38 236 q18 -34 42 -26 q6 18 -6 26 q-14 -8 -36 0 z" fill="#7A5A5F" opacity="0.6"/>
    <!-- 低马尾 -->
    <rect x="-14" y="290" width="28" height="176" rx="14" fill="#5A434A"/>
    <path d="M-7 470 q7 6 14 0 q2 -40 0 -160 M7 470 q-7 6 -14 0 q-2 -36 0 -150" stroke="#7A5A5F" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- 发圈（樱粉） -->
    <rect x="-16" y="286" width="32" height="11" rx="5.5" fill="#3898A0"/>
  </g>

  <!-- ================= 底部柜台 ================= -->
  <rect x="0" y="422" width="640" height="10" fill="#D3AC86"/>
  <rect x="0" y="432" width="640" height="48" fill="#B8926F"/>
  <rect x="0" y="474" width="640" height="6" fill="#A97F5E"/>
  <!-- 中间一杯热咖啡 -->
  <g>
    <ellipse cx="340" cy="426" rx="17" ry="5.5" fill="#C9A184"/>
    <rect x="325" y="390" width="30" height="37" rx="6" fill="#FFFDF8"/>
    <ellipse cx="340" cy="392" rx="15" ry="4.6" fill="#6E4A37"/>
    <path d="M355 398 a8 8 0 0 1 0 11" fill="none" stroke="#FFFDF8" stroke-width="3"/>
    <!-- 热气 -->
    <path d="M334 380 q-4 -8 0 -12 M347 382 q4 -9 0 -13" stroke="#D8B79A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
