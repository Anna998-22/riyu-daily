<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="外带打包">
  <!-- ================= 墙 + 光弧 ================= -->
  <rect x="0" y="0" width="640" height="480" fill="#F6E8D9"/>
  <rect x="58" y="70" width="252" height="292" rx="126" fill="#EEDDCA" opacity="0.85"/>
  <rect x="352" y="70" width="230" height="300" rx="115" fill="#F2E2D3" opacity="0.9"/>

  <!-- ================= 左：店員（微笑介绍外带装） ================= -->
  <g>
    <ellipse cx="196" cy="224" rx="30" ry="32" fill="#5A434A"/>
    <path d="M170 208 q30 -34 52 -6 q-6 16 -26 16 q-10 -6 -26 -10 z" fill="#7A5A5F" opacity="0.55"/>
    <ellipse cx="198" cy="235" rx="18.5" ry="18" fill="#F6CBAF"/>
    <path d="M182 226 q6 -10 16 -8 q10 -4 18 4 q2 10 -8 12 q-12 2 -26 -8 z" fill="#5A434A"/>
    <path d="M178 216 q-8 20 -6 34 q4 2 8 0 q2 -16 4 -30 z" fill="#5A434A"/>
    <path d="M218 216 q8 20 6 34 q-4 2 -8 0 q-2 -16 -4 -30 z" fill="#5A434A"/>
    <line x1="186" y1="234" x2="193" y2="232" stroke="#8A5A52" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="205" y1="232" x2="212" y2="234" stroke="#8A5A52" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="192" cy="240" rx="3.4" ry="4.4" fill="#4A3438"/>
    <ellipse cx="210" cy="240" rx="3.4" ry="4.4" fill="#4A3438"/>
    <circle cx="193" cy="238.6" r="1" fill="#fff"/>
    <circle cx="211" cy="238.6" r="1" fill="#fff"/>
    <path d="M197 248 Q201 251 205 248" fill="none" stroke="#B0654A" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="186" cy="246" rx="5" ry="2.8" fill="#EEA3A0" opacity="0.6"/>
    <ellipse cx="212" cy="246" rx="5" ry="2.8" fill="#EEA3A0" opacity="0.6"/>
    <!-- 颈 -->
    <rect x="189" y="251" width="14" height="26" rx="7" fill="#F6CBAF"/>
    <path d="M134 278 Q196 258 258 278 L272 476 Q196 490 120 476 Z" fill="#F1E6DA"/>
    <path d="M166 284 Q196 274 226 284 L238 478 Q196 490 154 478 Z" fill="#3D6BA8"/>
    <path d="M166 284 Q196 274 226 284 L222 308 Q196 302 170 308 Z" fill="#3898A0"/>
    <!-- 双臂（身前交叠，双手可见） -->
    <path d="M150 334 C170 330 180 322 190 320" fill="none" stroke="#F1E6DA" stroke-width="16" stroke-linecap="round"/>
    <path d="M242 334 C222 330 212 322 202 320" fill="none" stroke="#F1E6DA" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="191" cy="326" rx="8" ry="11" fill="#F6CBAF" transform="rotate(-10 191 326)"/>
    <ellipse cx="201" cy="326" rx="8" ry="11" fill="#F6CBAF" transform="rotate(10 201 326)"/>
    <rect x="136" y="264" width="20" height="56" rx="10" fill="#5A434A"/>
    <rect x="236" y="264" width="20" height="56" rx="10" fill="#5A434A"/>
  </g>

  <!-- ================= 中间：外带带盖纸杯 ================= -->
  <g>
    <ellipse cx="332" cy="425" rx="23" ry="6.8" fill="#C9A184"/>
    <rect x="311" y="360" width="42" height="66" rx="9" fill="#FFFDF8"/>
    <!-- 隔热带 -->
    <rect x="314" y="390" width="36" height="24" rx="3" fill="#E8C9A9"/>
    <line x1="326" y1="390" x2="326" y2="414" stroke="#D2AD86" stroke-width="2"/>
    <line x1="338" y1="390" x2="338" y2="414" stroke="#D2AD86" stroke-width="2"/>
    <circle cx="350" cy="402" r="3.6" fill="#3898A0"/>
    <!-- 平盖 -->
    <rect x="305" y="344" width="54" height="18" rx="8" fill="#F2E8DE"/>
    <rect x="305" y="358" width="54" height="4" fill="#E6D6C8"/>
    <ellipse cx="332" cy="352" rx="12" ry="3" fill="#EADACB"/>
    <!-- 热气 -->
    <path d="M322 336 q-4 -9 0 -14 M336 332 q4 -10 0 -15 M346 338 q-4 -8 0 -12" stroke="#D8B79A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 樱粉“外带”星光 -->
  <g fill="#D6E6EE">
    <ellipse cx="286" cy="366" rx="5.5" ry="5.5"/><ellipse cx="286" cy="355" rx="5.5" ry="5.5"/>
    <ellipse cx="275" cy="360.5" rx="5.5" ry="5.5"/><ellipse cx="297" cy="360.5" rx="5.5" ry="5.5"/>
    <ellipse cx="376" cy="382" rx="5" ry="5"/><ellipse cx="376" cy="372" rx="5" ry="5"/>
    <ellipse cx="366" cy="377" rx="5" ry="5"/><ellipse cx="386" cy="377" rx="5" ry="5"/>
  </g>

  <!-- ================= 右：你（背影·粉外套·双手自然垂身侧） ================= -->
  <g transform="translate(473 0)">
    <rect x="-45" y="292" width="90" height="156" rx="34" fill="#3898A0"/>
    <!-- 肩线（勾出肩膀） -->
    <path d="M-20 304 Q-36 306 -43 324" stroke="#266C74" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M20 304 Q36 306 43 324" stroke="#266C74" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- 两臂垂在身侧 -->
    <path d="M-45 322 C-52 350 -53 372 -52 388" fill="none" stroke="#3898A0" stroke-width="15" stroke-linecap="round"/>
    <path d="M45 322 C52 350 53 372 52 388" fill="none" stroke="#3898A0" stroke-width="15" stroke-linecap="round"/>
    <!-- 双手（皮肤色小拳） -->
    <ellipse cx="-54" cy="395" rx="6.5" ry="9" fill="#F6CBAF"/>
    <ellipse cx="54" cy="395" rx="6.5" ry="9" fill="#F6CBAF"/>
    <!-- 及肩发 -->
    <ellipse cx="0" cy="250" rx="41" ry="45" fill="#5A434A"/>
    <path d="M-38 236 q18 -34 42 -26 q6 18 -6 26 q-14 -8 -36 0 z" fill="#7A5A5F" opacity="0.6"/>
    <!-- 低马尾 -->
    <rect x="-14" y="290" width="28" height="176" rx="14" fill="#5A434A"/>
    <path d="M-7 470 q7 6 14 0 q2 -40 0 -160 M7 470 q-7 6 -14 0 q-2 -36 0 -150" stroke="#7A5A5F" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- 发圈 -->
    <rect x="-16" y="286" width="32" height="11" rx="5.5" fill="#3898A0"/>
  </g>
  <!-- 牛皮纸外带袋（在你身前、柜台上） -->
  <g>
    <path d="M410 362 q-3 -9 4 -12 q5 2 4 12" fill="none" stroke="#A97F5E" stroke-width="5" stroke-linecap="round"/>
    <path d="M440 362 q3 -9 -4 -12 q-5 2 -4 12" fill="none" stroke="#A97F5E" stroke-width="5" stroke-linecap="round"/>
    <rect x="402" y="362" width="56" height="60" rx="7" fill="#D6AD84"/>
    <rect x="402" y="362" width="56" height="10" rx="4" fill="#C69B7A"/>
    <rect x="402" y="366" width="56" height="3" fill="#B58B66"/>
    <circle cx="430" cy="406" r="5" fill="#3898A0"/>
    <path d="M414 420 h32 l-5 6 h-22 z" fill="#266C74" opacity="0.75"/>
  </g>

  <!-- ================= 底部柜台 ================= -->
  <rect x="0" y="422" width="640" height="10" fill="#D3AC86"/>
  <rect x="0" y="432" width="640" height="48" fill="#B8926F"/>
  <rect x="0" y="474" width="640" height="6" fill="#A97F5E"/>
</svg>
